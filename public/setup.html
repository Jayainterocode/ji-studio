<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types ji">
<meta name="referrer" content="no-referrer">
<title>Setup admin · JI Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2d5592">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JI Studio">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="img/icon-192.png" type="image/png">
<link rel="preload" href="fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="core/app.css">
<script type="module" src="core/boot.js"></script>
<script type="module" src="core/account.js"></script>
</head>
<body class="auth-body">
<main class="auth">
  <form class="card" id="fSetup" data-page="setup" novalidate>
    <div class="auth-head"><img src="img/icon-192.png" alt="" width="56" height="56"><h1>Setup admin pertama</h1><p>Hanya bisa sekali, saat belum ada pengguna. Kunci setup ada di ji-config.php.</p></div>
    <label for="sKey">Kunci setup</label>
    <div class="pw"><input type="password" id="sKey" autocomplete="off" required><button type="button" data-toggle="sKey">Lihat</button></div>
    <label for="sName">Nama</label><input type="text" id="sName" autocomplete="name" maxlength="80">
    <label for="sUser">Username</label><input type="text" id="sUser" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="40" required>
    <label for="sEmail">Email</label><input type="email" id="sEmail" autocomplete="email" required>
    <label for="sPass">Password</label>
    <div class="pw"><input type="password" id="sPass" autocomplete="new-password" minlength="8" required><button type="button" data-toggle="sPass">Lihat</button></div>
    <button class="main" type="submit" id="bSetup">Buat admin</button>
    <p class="msg" id="sMsg" role="status"></p>
  </form>
  <p class="auth-foot">JI Studio · Jaya Intero</p>
</main>
</body>
</html>
