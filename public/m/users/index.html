<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types ji">
<meta name="referrer" content="no-referrer">
<title>Pengguna · JI Studio</title>
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#2d5592">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JI Studio">
<link rel="apple-touch-icon" href="../../img/icon-180.png">
<link rel="icon" href="../../img/icon-192.png" type="image/png">
<link rel="preload" href="../../fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../core/app.css">
<script type="module" src="../../core/boot.js"></script>
<script type="module" src="users.js"></script>
</head>
<body class="gate">
<header class="top">
  <a class="back" href="../../"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Beranda</a>
  <span class="top-title">Pengguna</span>
  <div class="who" id="who"></div>
</header>
<main class="wrap split">
  <div>
    <h1>Kelola pengguna</h1>
    <p class="sub">Tambah anggota tim. Mereka menerima email untuk membuat password sendiri.</p>
    <form class="card" id="fAdd" novalidate>
      <h2><span class="step" aria-hidden="true">+</span>Tambah pengguna</h2>
      <label for="aName">Nama</label><input type="text" id="aName" maxlength="80" autocomplete="off">
      <div class="grid2">
        <div><label for="aUser">Username</label><input type="text" id="aUser" maxlength="40" autocapitalize="none" spellcheck="false" autocomplete="off" required></div>
        <div><label for="aRole">Peran</label><select id="aRole"><option value="staf">Staf</option><option value="admin">Admin</option></select></div>
      </div>
      <label for="aEmail">Email</label><input type="email" id="aEmail" autocomplete="off" required>
      <p class="hint">Username: huruf kecil, angka, titik, minus, atau garis bawah (3–40 karakter).</p>
      <button class="main full" type="submit" id="bAdd">Tambah &amp; kirim undangan</button>
      <p class="msg" id="aMsg" role="status"></p>
    </form>
  </div>
  <section class="card">
    <h2>Daftar pengguna</h2>
    <ul class="ulist" id="list"></ul>
    <p class="msg" id="lMsg" role="status"></p>
  </section>
</main>
</body>
</html>
