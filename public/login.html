<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types ji">
<meta name="referrer" content="no-referrer">
<title>Masuk · JI Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2d5592">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JI Studio">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="img/icon-192.png" type="image/png">
<link rel="preload" href="fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="core/app.css">
<script type="module" src="core/boot.js"></script>
<script type="module" src="core/account.js"></script>
<script type="module" src="core/install.js"></script>
</head>
<body class="auth-body">
<main class="auth">
  <form class="card" id="fLogin" data-page="login" novalidate>
    <div class="auth-head"><img src="img/icon-192.png" alt="" width="56" height="56"><h1>Masuk</h1><p>ke JI Studio, alat konten Jaya Intero</p></div>
    <label for="lUser">Username atau email</label>
    <input type="text" id="lUser" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="lPass">Password</label>
    <div class="pw"><input type="password" id="lPass" autocomplete="current-password" required><button type="button" data-toggle="lPass">Lihat</button></div>
    <button class="main" type="submit" id="bLogin">Masuk</button>
    <p class="msg" id="lMsg" role="status"></p>
    <div class="auth-alt"><button class="link" type="button" id="toForgot">Lupa password?</button></div>
  </form>
  <form class="card" id="fForgot" hidden novalidate>
    <div class="auth-head"><img src="img/icon-192.png" alt="" width="56" height="56"><h1>Lupa password</h1><p>Kami kirim tautan untuk membuat password baru ke email Anda.</p></div>
    <label for="fLogin2">Username atau email</label>
    <input type="text" id="fLogin2" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <button class="main" type="submit" id="bForgot">Kirim tautan</button>
    <p class="msg" id="fMsg" role="status"></p>
    <div class="auth-alt"><button class="link" type="button" id="toLogin">Kembali ke halaman masuk</button></div>
  </form>
  <section class="install card" id="install" hidden></section>
  <p class="auth-foot">JI Studio · Jaya Intero</p>
</main>
</body>
</html>
